<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学天赋树 · 家族与抽象度</title>
<style>
  :root { --bg:#0a0c11; --fg:#e6e9ef; --muted:#8b93a1; --line:#1e2430; --accent:#f0a04b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; }
  #tree { position:fixed; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  #tree.drag { cursor:grabbing; }

  .hud { position:fixed; left:22px; top:18px; width:268px; pointer-events:none; }
  .hud h1 { font-size:19px; margin:0 0 2px; }
  .hud .sub { color:var(--muted); font-size:12px; margin:0 0 10px; }
  .hud input { pointer-events:auto; width:100%; padding:7px 10px; font:inherit; font-size:13px;
    color:var(--fg); background:rgba(18,23,32,.92); border:1px solid var(--line); border-radius:8px; outline:none; }
  .hud input:focus { border-color:#3a4557; }
  .results { margin-top:6px; max-height:180px; overflow:auto; pointer-events:auto; }
  .results a { display:block; padding:4px 8px; font-size:12.5px; color:#c9d1de; text-decoration:none; border-radius:6px; }
  .results a:hover { background:#1b2230; }

  .legend { position:fixed; left:22px; bottom:44px; width:268px; max-height:38vh; overflow:auto;
    font-size:11.5px; color:var(--muted); pointer-events:auto; }
  .legend .fam { display:flex; align-items:center; gap:7px; padding:2px 6px; border-radius:6px; cursor:pointer; }
  .legend .fam:hover { background:#161d29; }
  .legend .fam.on { background:#1b2433; color:#dfe6f0; }
  .legend i { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .legend .n { margin-left:auto; opacity:.7; }
  .legend .rings { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .legend .rings div { display:flex; gap:7px; align-items:center; }
  .legend .rings span { width:8px; height:8px; border:1px solid #55607a; border-radius:50%; }

  .toolbar { position:fixed; right:18px; top:16px; display:flex; gap:8px; }
  .toolbar button { font:inherit; font-size:12px; padding:6px 11px; cursor:pointer; color:#c9d1de;
    background:rgba(22,28,38,.92); border:1px solid var(--line); border-radius:8px; }
  .toolbar button:hover { border-color:#3a4557; }
  .toolbar button.off { opacity:.45; }

  .tip { position:fixed; pointer-events:none; max-width:330px; padding:9px 12px; border-radius:9px;
    background:rgba(16,21,30,.97); border:1px solid #2b3446; box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0; transform:translateY(4px); transition:opacity .1s; z-index:20; }
  .tip.on { opacity:1; transform:none; }
  .tip b { display:block; font-size:13.5px; margin-bottom:3px; }
  .tip span { color:var(--muted); font-size:11.5px; }

  .panel { position:fixed; right:18px; bottom:18px; width:350px; max-height:62vh; overflow:auto;
    background:rgba(16,21,30,.97); border:1px solid #2b3446; border-radius:12px; padding:16px 18px;
    transform:translateY(12px); opacity:0; pointer-events:none; transition:.18s; z-index:21; }
  .panel.on { transform:none; opacity:1; pointer-events:auto; }
  .panel .badge { font-size:11px; color:var(--muted); letter-spacing:.04em; }
  .panel h2 { font-size:16px; margin:4px 0 10px; line-height:1.4; }
  .panel dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0 0 12px; font-size:12.5px; }
  .panel dt { color:var(--muted); }
  .panel dd { margin:0; color:#c9d1de; }
  .panel .acts { display:flex; flex-wrap:wrap; gap:8px; }
  .panel .acts a { font-size:12.5px; padding:6px 11px; border-radius:8px; text-decoration:none;
    color:#10151d; background:var(--accent); font-weight:600; }
  .panel .acts a.ghost { background:transparent; color:#c9d1de; border:1px solid var(--line); font-weight:400; }
  .panel .close { position:absolute; right:12px; top:10px; cursor:pointer; color:var(--muted); font-size:16px; }
  .hint { position:fixed; left:22px; bottom:14px; color:var(--muted); font-size:11.5px; }

  @media (max-width:860px){ .hud,.legend{ width:calc(100% - 44px); } .panel{ left:18px; right:18px; width:auto; } }
</style>
</head>
<body>
<canvas id="tree"></canvas>

<div class="hud">
  <h1>数学天赋树</h1>
  <p class="sub" id="sub">角度 = 家族 · 半径 = 抽象度</p>
  <input id="q" type="search" placeholder="搜索条目，例如：同调、辛、MCMC">
  <div class="results" id="results"></div>
</div>

<div class="legend" id="legend"></div>

<div class="toolbar">
  <button id="bFit">适配视图</button>
  <button id="bEdges">连线</button>
  <button id="bLabels">标签</button>
</div>

<div class="tip" id="tip"></div>

<aside class="panel" id="panel">
  <span class="close" id="close">×</span>
  <div id="panelBody"></div>
</aside>

<div class="hint">滚轮缩放 · 拖动平移 · 点家族可只看一族 · 双击节点打开文档 · Esc 取消</div>

<script>
'use strict';
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
    'color:#ff9b93;font:14px/1.6 ui-monospace,Consolas,monospace;background:#1b1013;' +
    'padding:16px 20px;border:1px solid #5a2a2a;border-radius:10px;max-width:70vw;z-index:99';
  d.textContent = '天赋树脚本出错：' + e.message + '（第 ' + e.lineno + ' 行）';
  document.body.appendChild(d);
});

const DATA = /*__DATA__*/;
const EDGES = /*__EDGES__*/;
const byId = {};
const famOf = {};
DATA.families.forEach(f => { famOf[f.key] = f; });
DATA.nodes.forEach(n => { byId[n.id] = n; });

const cv = document.getElementById('tree');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, zoom: 0.2 };
let hover = null, sel = null, showEdges = true, showLabels = true, focusFam = null;
let dragging = false, down = null, moved = 0;

const neighbors = {};
EDGES.forEach(e => {
  (neighbors[e.a] = neighbors[e.a] || new Set()).add(e.b);
  (neighbors[e.b] = neighbors[e.b] || new Set()).add(e.a);
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const sx = wx => (wx - cam.x) * cam.zoom + W / 2;
const sy = wy => (wy - cam.y) * cam.zoom + H / 2;
const wxAt = px => (px - W / 2) / cam.zoom + cam.x;
const wyAt = py => (py - H / 2) / cam.zoom + cam.y;

function fit() {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of DATA.nodes) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  cam.zoom = Math.max(0.06, Math.min(1.2, Math.min(W * 0.82 / w, H * 0.78 / h)));
  cam.x = (minX + maxX) / 2 - 60 / cam.zoom;
  cam.y = (minY + maxY) / 2;
}

function radiusOf(n) {
  const boost = (n === hover || n === sel) ? 1.35 : 1;
  return Math.max(3.2, n.size * cam.zoom * boost);
}

function pick(px, py) {
  let best = null, bestD = Infinity;
  for (const n of DATA.nodes) {
    const r = radiusOf(n) + 4;
    const d2 = (sx(n.x) - px) ** 2 + (sy(n.y) - py) ** 2;
    if (d2 <= r * r && d2 < bestD) { best = n; bestD = d2; }
  }
  return best;
}

/* ---------------- 绘制 ---------------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 60, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  bg.addColorStop(0, '#10151f');
  bg.addColorStop(1, '#07090d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const cx = sx(0), cy = sy(0);
  const maxR = 1290;

  for (const f of DATA.families) {
    for (const a of [f.a0, f.a1]) {
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 120 * cam.zoom, cy + Math.sin(a) * 120 * cam.zoom);
      ctx.lineTo(cx + Math.cos(a) * maxR * cam.zoom, cy + Math.sin(a) * maxR * cam.zoom);
      ctx.strokeStyle = 'rgba(130,145,175,.10)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  for (const lvl in DATA.rings) {
    ctx.beginPath();
    ctx.arc(cx, cy, DATA.rings[lvl] * cam.zoom, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(140,150,175,.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const active = sel || hover;
  const near = active ? (neighbors[active.id] || new Set()) : null;

  if (showEdges) {
    for (const e of EDGES) {
      const A = byId[e.a], B = byId[e.b];
      if (!A || !B) continue;
      const hot = active && (e.a === active.id || e.b === active.id);
      const inFam = focusFam && (A.family === focusFam || B.family === focusFam);
      let alpha, width, dash = [];
      if (e.kind === 'bridge') { alpha = hot ? 0.95 : 0.42; width = hot ? 2 : 1.3; dash = [5, 4]; }
      else if (e.kind === 'spine') { alpha = hot ? 0.9 : (focusFam ? (inFam ? 0.4 : 0.05) : 0.26); width = hot ? 2 : 1.2; }
      else if (e.kind === 'root') { alpha = hot ? 0.9 : 0.18; width = 1.1; }
      else if (e.kind === 'section') { alpha = 0.12; width = 0.8; }
      else { alpha = hot ? 0.8 : 0.10; width = 0.9; }
      if (active && !hot) alpha *= 0.28;

      ctx.globalAlpha = alpha;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash);
      const ax = sx(A.x), ay = sy(A.y), bx = sx(B.x), by = sy(B.y);
      if (e.kind === 'bridge' || e.kind === 'weak') {
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(mx - dy / L * L * 0.09, my + dx / L * L * 0.09, bx, by);
        ctx.stroke();
        if (e.label && (hot || !active) && cam.zoom > 0.18) {
          ctx.setLineDash([]);
          ctx.globalAlpha = hot ? 1 : 0.55;
          ctx.fillStyle = e.color;
          ctx.font = '600 10.5px -apple-system,"Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = 'rgba(6,8,13,.9)';
          ctx.lineWidth = 3;
          ctx.strokeText(e.label, mx, my - 5);
          ctx.fillText(e.label, mx, my - 5);
          ctx.textAlign = 'left';
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
  }

  const boxes = [];
  const overlaps = b => boxes.some(o =>
    !(b.x + b.w < o.x || o.x + o.w < b.x || b.y + b.h < o.y || o.y + o.h < b.y));
  const need = { '0': 0, '0.5': 0.07, '1': 0.15, '2': 0.24, '3': 0.34 };

  for (const n of DATA.nodes) {
    const isActive = n === active;
    const dimByFocus = focusFam && n.family !== focusFam && !isActive;
    const dim = (active && !isActive && !(near && near.has(n.id))) || dimByFocus;
    const r = radiusOf(n);
    const px = sx(n.x), py = sy(n.y);
    ctx.globalAlpha = dim ? 0.22 : 1;

    if (n.family === 'M') {
      const g = ctx.createRadialGradient(px, py, 0, px, py, r * 3.4);
      g.addColorStop(0, n.color + 'aa');
      g.addColorStop(1, n.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? n.color + '66' : '#0c1119';
    ctx.fill();
    ctx.strokeStyle = n.color;
    ctx.lineWidth = n.child ? 1 : (n.family === 'M' ? 2.6 : 1.8);
    ctx.stroke();

    if (!n.child) {
      ctx.beginPath();
      ctx.arc(px, py, Math.max(1.4, r * 0.3), 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.fill();
    }
    if (isActive) {
      ctx.beginPath();
      ctx.arc(px, py, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    const show = showLabels && cam.zoom > 0.1 &&
      (isActive || cam.zoom >= (n.child ? 0.6 : need[n.level] || 0.4) || (near && near.has(n.id)));
    if (show && !dim) {
      const fs = n.child ? 9.5 : 12;
      ctx.font = (isActive ? '600 ' : '') + fs + 'px -apple-system,"Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(n.short).width;
      const ly = py + r + (n.child ? 10 : 15);
      const box = { x: px - tw / 2 - 2, y: ly - 11, w: tw + 4, h: 14 };
      if (isActive || !overlaps(box)) {
        boxes.push(box);
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(6,8,13,.9)';
        ctx.lineWidth = 3;
        ctx.strokeText(n.short, px, ly);
        ctx.fillStyle = isActive ? '#fff' : '#c9d3e0';
        ctx.fillText(n.short, px, ly);
      }
    }
  }
  ctx.textAlign = 'left';

  ctx.textAlign = 'center';
  for (const f of DATA.families) {
    const a = (f.a0 + f.a1) / 2;
    const rr = (maxR + 240) * cam.zoom;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    const dim = focusFam && focusFam !== f.key;
    ctx.globalAlpha = dim ? 0.25 : 0.95;
    ctx.font = '600 12px -apple-system,"Microsoft YaHei",sans-serif';
    ctx.fillStyle = f.color;
    ctx.fillText(f.name, px, py);
    ctx.globalAlpha = 0.6;
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = '#8b93a1';
    ctx.fillText(f.count + ' 条', px, py + 13);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ---------------- 面板 / 提示 ---------------- */
const tip = document.getElementById('tip');
function showTip(n, mx, my) {
  if (!n) { tip.classList.remove('on'); return; }
  const f = famOf[n.family];
  tip.innerHTML = '<b>' + n.title + '</b><span>' + (f ? f.name : '') +
    ' · ' + (DATA.levelLabel[n.level] || '') + (n.cat ? ' · ' + n.cat : '') + '</span>';
  tip.style.left = Math.min(mx + 16, W - 350) + 'px';
  tip.style.top = Math.min(my + 16, H - 120) + 'px';
  tip.classList.add('on');
}

const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');

function showPanel(n) {
  const f = famOf[n.family];
  const nb = [...(neighbors[n.id] || [])].filter(id => !byId[id].child)
    .map(id => byId[id].short).slice(0, 8).join('、') || '—';
  panelBody.innerHTML =
    '<div class="badge">' + (f ? f.name : '') + ' · ' + (DATA.levelLabel[n.level] || '') +
      (n.child ? ' · 小节' : ' · 第 ' + (n.num || 1) + ' 条') + '</div>' +
    '<h2>' + n.title + '</h2>' +
    '<dl><dt>范畴</dt><dd>' + (n.cat || '—') + '</dd><dt>邻居</dt><dd>' + nb + '</dd></dl>' +
    '<div class="acts"><a href="' + n.url + '">读这一节 →</a></div>';
  panel.classList.add('on');
}

function select(n) {
  sel = n;
  if (n) showPanel(n); else panel.classList.remove('on');
}

document.getElementById('close').onclick = () => select(null);

/* ---------------- 图例 ---------------- */
const legend = document.getElementById('legend');
DATA.families.forEach(f => {
  const d = document.createElement('div');
  d.className = 'fam';
  d.dataset.key = f.key;
  d.innerHTML = '<i style="background:' + f.color + '"></i>' + f.name +
    '<span class="n">' + f.count + '</span>';
  d.onclick = () => {
    focusFam = (focusFam === f.key) ? null : f.key;
    [...legend.querySelectorAll('.fam')].forEach(x =>
      x.classList.toggle('on', x.dataset.key === focusFam));
  };
  legend.appendChild(d);
});
const ringBox = document.createElement('div');
ringBox.className = 'rings';
ringBox.innerHTML = Object.keys(DATA.rings).map(k =>
  '<div><span></span>' + DATA.levelLabel[k] + ' · 半径 ' + DATA.rings[k] + '</div>').join('');
legend.appendChild(ringBox);

/* ---------------- 交互 ---------------- */
cv.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; down = { x: e.clientX, y: e.clientY };
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (dragging && down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.zoom;
    cam.y -= dy / cam.zoom;
    down = { x: e.clientX, y: e.clientY };
    showTip(null);
  } else {
    hover = pick(e.clientX, e.clientY);
    showTip(hover, e.clientX, e.clientY);
    cv.style.cursor = hover ? 'pointer' : 'grab';
  }
});
cv.addEventListener('pointerup', e => {
  dragging = false; down = null; cv.classList.remove('drag');
  if (moved < 5) select(pick(e.clientX, e.clientY));
});
cv.addEventListener('pointerleave', () => { hover = null; showTip(null); });
cv.addEventListener('dblclick', e => {
  const n = pick(e.clientX, e.clientY);
  if (n) location.href = n.url;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const px = e.clientX, py = e.clientY;
  const wx = wxAt(px), wy = wyAt(py);
  cam.zoom = Math.max(0.05, Math.min(3.2, cam.zoom * (e.deltaY > 0 ? 0.88 : 1.14)));
  cam.x = wx - (px - W / 2) / cam.zoom;
  cam.y = wy - (py - H / 2) / cam.zoom;
}, { passive: false });

document.getElementById('bFit').onclick = fit;
document.getElementById('bEdges').onclick = e => {
  showEdges = !showEdges; e.target.classList.toggle('off', !showEdges);
};
document.getElementById('bLabels').onclick = e => {
  showLabels = !showLabels; e.target.classList.toggle('off', !showLabels);
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    select(null); focusFam = null;
    [...legend.querySelectorAll('.fam')].forEach(x => x.classList.remove('on'));
  }
  if (e.key === 'f' || e.key === 'F') fit();
});

/* ---------------- 搜索 ---------------- */
const q = document.getElementById('q'), results = document.getElementById('results');
q.addEventListener('input', () => {
  const s = q.value.trim();
  if (!s) { results.innerHTML = ''; return; }
  const hits = DATA.nodes.filter(n => (n.title + n.cat).toLowerCase().includes(s.toLowerCase())).slice(0, 12);
  results.innerHTML = hits.map(n => '<a href="#" data-id="' + n.id + '">' + n.title + '</a>').join('');
  [...results.children].forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      const n = byId[a.dataset.id];
      select(n);
      cam.zoom = Math.max(cam.zoom, 0.55);
      cam.x = n.x; cam.y = n.y;
    };
  });
});

/* ---------------- 启动 ---------------- */
const qs = new URLSearchParams(location.hash.replace(/^#/, ''));
resize();
fit();
if (qs.has('sel') && byId[qs.get('sel')]) {
  const n0 = byId[qs.get('sel')];
  select(n0);
  cam.x = n0.x; cam.y = n0.y; cam.zoom = Math.max(cam.zoom, 0.7);
}

const mainCount = DATA.nodes.filter(n => !n.child).length;
document.getElementById('sub').textContent =
  mainCount + ' 个条目 · ' + DATA.families.length + ' 个家族 · 角度=家族，半径=抽象度';

function loop() { draw(); requestAnimationFrame(loop); }
loop();
window.addEventListener('resize', resize);
</script>
</body>
</html>
