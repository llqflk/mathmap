<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学天赋树 · 数学范畴与应用实例</title>
<style>
  :root { --bg:#0a0c11; --fg:#e6e9ef; --muted:#8b93a1; --line:#1e2430; --accent:#f0a04b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; }
  #tree { position:fixed; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  #tree.drag { cursor:grabbing; }

  .hud { position:fixed; left:22px; top:18px; width:274px; pointer-events:none; }
  .hud h1 { font-size:19px; margin:0 0 2px; letter-spacing:.02em; }
  .hud .sub { color:var(--muted); font-size:12px; margin:0 0 12px; }
  .hud input { pointer-events:auto; width:100%; padding:7px 10px; font:inherit; font-size:13px;
    color:var(--fg); background:rgba(18,23,32,.92); border:1px solid var(--line); border-radius:8px; outline:none; }
  .hud input:focus { border-color:#3a4557; }
  .hud .results { margin-top:6px; max-height:200px; overflow:auto; pointer-events:auto; }
  .hud .results a { display:block; padding:4px 8px; font-size:12.5px; color:#c9d1de; text-decoration:none; border-radius:6px; }
  .hud .results a:hover { background:#1b2230; }
  .legend { margin-top:14px; font-size:11.5px; color:var(--muted); }
  .legend div { display:flex; align-items:center; gap:7px; margin:3px 0; }
  .legend i { width:9px; height:9px; display:inline-block; background:#666; }
  .legend i.c { border-radius:50%; }
  .legend i.h { clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .legend i.line { width:16px; height:2px; border-radius:2px; }

  .toolbar { position:fixed; right:18px; top:16px; display:flex; gap:8px; }
  .toolbar button { font:inherit; font-size:12px; padding:6px 11px; cursor:pointer; color:#c9d1de;
    background:rgba(22,28,38,.92); border:1px solid var(--line); border-radius:8px; }
  .toolbar button:hover { border-color:#3a4557; }
  .toolbar button.off { opacity:.45; }

  .tip { position:fixed; pointer-events:none; max-width:320px; padding:9px 12px; border-radius:9px;
    background:rgba(16,21,30,.97); border:1px solid #2b3446; box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0; transform:translateY(4px); transition:opacity .1s; z-index:20; }
  .tip.on { opacity:1; transform:none; }
  .tip b { display:block; font-size:13.5px; margin-bottom:3px; }
  .tip span { color:var(--muted); font-size:11.5px; }

  .panel { position:fixed; right:18px; bottom:18px; width:340px; max-height:60vh; overflow:auto;
    background:rgba(16,21,30,.97); border:1px solid #2b3446; border-radius:12px; padding:16px 18px;
    transform:translateY(12px); opacity:0; pointer-events:none; transition:.18s; z-index:21; }
  .panel.on { transform:none; opacity:1; pointer-events:auto; }
  .panel .badge { font-size:11px; color:var(--muted); letter-spacing:.04em; }
  .panel h2 { font-size:16px; margin:4px 0 10px; line-height:1.4; }
  .panel dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0 0 12px; font-size:12.5px; }
  .panel dt { color:var(--muted); }
  .panel dd { margin:0; color:#c9d1de; }
  .panel .acts { display:flex; flex-wrap:wrap; gap:8px; }
  .panel .acts a { font-size:12.5px; padding:6px 11px; border-radius:8px; text-decoration:none;
    color:#10151d; background:var(--accent); font-weight:600; }
  .panel .acts a.ghost { background:transparent; color:#c9d1de; border:1px solid var(--line); font-weight:400; }
  .panel .close { position:absolute; right:12px; top:10px; cursor:pointer; color:var(--muted); font-size:16px; }
  .panel .secs { margin-top:12px; padding-top:10px; border-top:1px solid #232c3a; }
  .panel .secs-title { font-size:11px; color:var(--muted); margin-bottom:5px; letter-spacing:.04em; }
  .panel .secs a { display:block; font-size:12.5px; color:#9fc4e8; text-decoration:none; padding:2px 0; }
  .panel .secs a:hover { color:#cfe4f8; text-decoration:underline; }
  .panel .sec { font-size:12px; color:#a9b4c4; padding:1px 0; }
  .hint { position:fixed; left:22px; bottom:14px; color:var(--muted); font-size:11.5px; }

  @media (max-width:820px){ .hud{ width:calc(100% - 44px); } .panel{ left:18px; right:18px; width:auto; } }
</style>
</head>
<body>
<canvas id="tree"></canvas>

<div class="hud">
  <h1>数学天赋树</h1>
  <p class="sub" id="sub">滚轮缩放 / 拖动平移 / 点击查看</p>
  <input id="q" type="search" placeholder="搜索节点，例如：同调、辛、MCMC">
  <div class="results" id="results"></div>
  <div class="legend">
    <div><i class="c" style="background:#f0a04b"></i>层级 0 元框架（起点）</div>
    <div><i class="h" style="background:#e06c75"></i>层级 0.5 范畴论工具箱</div>
    <div><i class="c" style="background:#61afef"></i>层级 1 抽象结构</div>
    <div><i class="c" style="background:#98c379"></i>层级 2 具体实例</div>
    <div><i class="c" style="background:#c678dd"></i>层级 3 模型计算</div>
    <div style="margin-top:8px"><i class="line" style="background:#e5c07b"></i>工具</div>
    <div><i class="line" style="background:#61afef"></i>结构</div>
    <div><i class="line" style="background:#98c379"></i>实例化</div>
    <div><i class="line" style="background:#c678dd"></i>算法化</div>
  </div>
</div>

<div class="toolbar">
  <button id="bFit">适配视图</button>
  <button id="bEdges">连线</button>
  <button id="bLabels">标签</button>
</div>

<div class="tip" id="tip"></div>

<aside class="panel" id="panel">
  <span class="close" id="close">×</span>
  <div id="panelBody"></div>
</aside>

<div class="hint">滚轮缩放 · 拖动平移 · 点击节点看详情 · 双击打开文档 · Esc 取消</div>

<script>
'use strict';
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
    'color:#ff9b93;font:14px/1.6 ui-monospace,Consolas,monospace;background:#1b1013;' +
    'padding:16px 20px;border:1px solid #5a2a2a;border-radius:10px;max-width:70vw;z-index:99';
  d.textContent = '天赋树脚本出错：' + e.message + '（第 ' + e.lineno + ' 行）';
  document.body.appendChild(d);
});

const DATA = /*__DATA__*/;
const EDGES = /*__EDGES__*/;
const byId = {};

/* ---------------- 画布 ---------------- */
const cv = document.getElementById('tree');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, zoom: 0.2 };
let hover = null, sel = null, showEdges = true, showLabels = true, dragging = false;

const levelOf = {};
DATA.nodes.forEach(n => {
  byId[n.id] = n;
  levelOf[n.id] = DATA.levels.find(l => l.key === n.level) || { ring: 0, color: '#888', size: 10 };
});

const neighbors = {};
EDGES.forEach(e => {
  (neighbors[e.a] = neighbors[e.a] || new Set()).add(e.b);
  (neighbors[e.b] = neighbors[e.b] || new Set()).add(e.a);
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------------- 坐标变换 ---------------- */
const toScreenX = wx => (wx - cam.x) * cam.zoom + W / 2;
const toScreenY = wy => (wy - cam.y) * cam.zoom + H / 2;
const toWorldX = sx => (sx - W / 2) / cam.zoom + cam.x;
const toWorldY = sy => (sy - H / 2) / cam.zoom + cam.y;

function fit() {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of DATA.nodes) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  const z = Math.min(W * 0.84 / w, H * 0.80 / h);
  cam.zoom = Math.max(0.08, Math.min(1.4, z));
  cam.x = (minX + maxX) / 2 - 40 / cam.zoom;
  cam.y = (minY + maxY) / 2;
}

/* ---------------- 命中测试 ---------------- */
function nodeRadiusScreen(n) {
  const base = levelOf[n.id].size;
  return Math.max(5, base * cam.zoom * (n === hover || n === sel ? 1.35 : 1));
}

function pick(mx, my) {
  let best = null, bestD = Infinity;
  for (const n of DATA.nodes) {
    const sx = toScreenX(n.x), sy = toScreenY(n.y);
    const r = nodeRadiusScreen(n) + 5;
    const d2 = (sx - mx) ** 2 + (sy - my) ** 2;
    if (d2 <= r * r && d2 < bestD) { best = n; bestD = d2; }
  }
  return best;
}

/* ---------------- 绘制 ---------------- */
function drawShape(n, sx, sy, r, active) {
  const lv = levelOf[n.id];
  ctx.save();
  ctx.translate(sx, sy);

  ctx.fillStyle = active ? lv.color + '55' : '#0d1219';
  ctx.strokeStyle = lv.color;
  ctx.lineWidth = Math.max(1.2, n.level === '0' ? 2.6 : n.level === '0.5' ? 2.2 : 1.7);
  ctx.beginPath();
  if (n.level === '0.5') {
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();

  if (n.child) {
    // 章节子节点：空心环，和平级的条目区分开
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(1.4, r * 0.45), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180,205,175,.85)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
  } else if (n.level === '0' || n.level === '0.5') {
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.52, 0, Math.PI * 2);
    ctx.fillStyle = lv.color;
    ctx.fill();
  } else if (n.level === '1' || n.level === '2') {
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(1.6, r * 0.32), 0, Math.PI * 2);
    ctx.fillStyle = lv.color;
    ctx.fill();
  }

  if (active) {
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W * 0.5, H * 0.48, 60, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  bg.addColorStop(0, '#0f141d');
  bg.addColorStop(1, '#07090d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const lv of DATA.levels) {
    if (!lv.ring) continue;
    ctx.beginPath();
    ctx.arc(toScreenX(0), toScreenY(0), lv.ring * cam.zoom, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(140,125,95,.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const active = sel || hover;
  const near = active ? (neighbors[active.id] || new Set()) : null;

  if (showEdges) {
    for (const e of EDGES) {
      const A = byId[e.a], B = byId[e.b];
      if (!A || !B) continue;
      const ax = toScreenX(A.x), ay = toScreenY(A.y);
      const bx = toScreenX(B.x), by = toScreenY(B.y);
      const hot = active && (e.a === active.id || e.b === active.id);
      const dim = active && !hot;
      ctx.globalAlpha = hot ? 0.95 : (dim ? 0.08 : 0.42);
      ctx.strokeStyle = e.color;
      ctx.lineWidth = hot ? 2.2 : Math.max(0.9, 1.5 * Math.min(cam.zoom, 1.4));
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      const dx = bx - ax, dy = by - ay;
      const L = Math.hypot(dx, dy) || 1;
      const bend = hot ? 0.05 : 0.14;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(mx - dy / L * L * bend * 0.12, my + dx / L * L * bend * 0.12, bx, by);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const boxes = [];
  const overlaps = b => boxes.some(o =>
    !(b.x + b.w < o.x || o.x + o.w < b.x || b.y + b.h < o.y || o.y + o.h < b.y));

  const nodes = DATA.nodes.slice().sort((a, b) => levelOf[a.id].ring - levelOf[b.id].ring);
  for (const n of nodes) {
    const lv = levelOf[n.id];
    const sx = toScreenX(n.x), sy = toScreenY(n.y);
    const isActive = n === active;
    const dim = active && !isActive && !(near && near.has(n.id));
    const r = nodeRadiusScreen(n);

    ctx.globalAlpha = dim ? 0.35 : 1;
    drawShape(n, sx, sy, r, isActive);
    ctx.globalAlpha = 1;

    const need = n.child ? 0.24 : ({ '0': 0, '0.5': 0.10, '1': 0.22, '2': 0.26, '3': 0.30 }[n.level] ?? 0.4);
    const labelOn = showLabels && cam.zoom > 0.16 && (isActive || cam.zoom >= need || (near && near.has(n.id)));
    if (labelOn && !dim) {
      const fs = n.child ? 10.5 : 12;
      ctx.font = (isActive ? '600 ' : '') + fs + 'px -apple-system,"Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(n.short).width;
      const ly = sy + r + (n.child ? 12 : 15);
      const box = { x: sx - tw / 2 - 2, y: ly - 11, w: tw + 4, h: 15 };
      if (isActive || !overlaps(box)) {
        boxes.push(box);
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(6,8,13,.9)';
        ctx.lineWidth = 3;
        ctx.strokeText(n.short, sx, ly);
        ctx.fillStyle = isActive ? '#ffffff' : '#c8d1de';
        ctx.fillText(n.short, sx, ly);
      }
    }
  }
  ctx.textAlign = 'left';
}

/* ---------------- 悬停提示 ---------------- */
const tip = document.getElementById('tip');
function showTip(n, mx, my) {
  if (!n) { tip.classList.remove('on'); return; }
  const lv = DATA.levels.find(l => l.key === n.level);
  tip.innerHTML = '<b>' + n.title + '</b><span>' + lv.name + (n.cat ? ' · ' + n.cat : '') + '</span>';
  tip.style.left = Math.min(mx + 16, W - 340) + 'px';
  tip.style.top = Math.min(my + 16, H - 120) + 'px';
  tip.classList.add('on');
}

/* ---------------- 面板 ---------------- */
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');

function showPanel(n) {
  const lv = DATA.levels.find(l => l.key === n.level);
  const nb = [...(neighbors[n.id] || [])]
    .filter(id => !(n.children && byId[id].child))
    .map(id => byId[id].short).join('、') || '—';
  const badge = n.child ? ('线性代数讲义 · ' + n.title) : (lv.name + ' · 第 ' + (n.num || 1) + ' 条');
  let extra = '';
  if (n.children && n.children.length) {
    extra = '<div class="secs"><div class="secs-title">包含 ' + n.children.length + ' 章</div>' +
      n.children.map(id => '<a href="' + byId[id].url + '">' + byId[id].title + '</a>').join('') +
      '</div>';
  } else if (n.sections && n.sections.length) {
    extra = '<div class="secs"><div class="secs-title">本章 ' + n.sections.length + ' 节</div>' +
      n.sections.map(s => '<div class="sec">' + s + '</div>').join('') + '</div>';
  }
  panelBody.innerHTML =
    '<div class="badge">' + badge + '</div>' +
    '<h2>' + n.title + '</h2>' +
    '<dl><dt>范畴</dt><dd>' + (n.cat || '—') + '</dd><dt>邻居</dt><dd>' + nb + '</dd></dl>' +
    '<div class="acts">' +
      '<a href="' + n.url + '">' + (n.child ? '读这一章 →' : '读这一节 →') + '</a>' +
      (n.quadric ? '<a class="ghost" href="/3d.html#' + n.quadric + '">看二次曲面</a>' : '') +
    '</div>' + extra;
  panel.classList.add('on');
}

function select(n) {
  sel = n;
  if (n) showPanel(n); else panel.classList.remove('on');
}

document.getElementById('close').onclick = () => { select(null); draw(); };

/* ---------------- 交互 ---------------- */
let down = null, moved = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; down = { x: e.clientX, y: e.clientY };
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (dragging && down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.zoom;
    cam.y -= dy / cam.zoom;
    down = { x: e.clientX, y: e.clientY };
    showTip(null);
  } else {
    const n = pick(e.clientX, e.clientY);
    hover = n;
    showTip(n, e.clientX, e.clientY);
    cv.style.cursor = n ? 'pointer' : 'grab';
  }
});
cv.addEventListener('pointerup', e => {
  dragging = false; down = null; cv.classList.remove('drag');
  if (moved < 5) select(pick(e.clientX, e.clientY));
});
cv.addEventListener('pointerleave', () => { hover = null; showTip(null); });
cv.addEventListener('dblclick', e => {
  const n = pick(e.clientX, e.clientY);
  if (n) location.href = n.url;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const mx = e.clientX, my = e.clientY;
  const wx = toWorldX(mx), wy = toWorldY(my);
  cam.zoom = Math.max(0.06, Math.min(3.4, cam.zoom * (e.deltaY > 0 ? 0.88 : 1.14)));
  cam.x = wx - (mx - W / 2) / cam.zoom;
  cam.y = wy - (my - H / 2) / cam.zoom;
}, { passive: false });

document.getElementById('bFit').onclick = () => fit();
document.getElementById('bEdges').onclick = e => {
  showEdges = !showEdges; e.target.classList.toggle('off', !showEdges);
};
document.getElementById('bLabels').onclick = e => {
  showLabels = !showLabels; e.target.classList.toggle('off', !showLabels);
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') select(null);
  if (e.key === 'f' || e.key === 'F') fit();
});

/* ---------------- 搜索 ---------------- */
const q = document.getElementById('q'), results = document.getElementById('results');
q.addEventListener('input', () => {
  const s = q.value.trim();
  if (!s) { results.innerHTML = ''; return; }
  const hits = DATA.nodes.filter(n => (n.title + n.cat).toLowerCase().includes(s.toLowerCase())).slice(0, 12);
  results.innerHTML = hits.map(n => '<a href="#" data-id="' + n.id + '">' + n.title + '</a>').join('');
  [...results.children].forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      const n = byId[a.dataset.id];
      select(n);
      cam.zoom = Math.max(cam.zoom, 0.5);
      cam.x = n.x; cam.y = n.y;
    };
  });
});

/* ---------------- 启动 ---------------- */
const chN = DATA.nodes.filter(n => n.child).length;
document.getElementById('sub').textContent =
  (DATA.nodes.length - chN) + ' 个条目' + (chN ? ' + ' + chN + ' 个小节' : '') + ' · 滚轮缩放 / 拖动平移';
// 支持 #sel=节点ID 直接定位（方便分享/截图）
const qs = new URLSearchParams(location.hash.replace(/^#/, ''));

function loop() { draw(); requestAnimationFrame(loop); }
resize();
fit();
if (qs.has('sel') && byId[qs.get('sel')]) {
  const n1 = byId[qs.get('sel')];
  select(n1);
  cam.x = n1.x; cam.y = n1.y; cam.zoom = Math.max(cam.zoom, 0.75);
}
loop();
window.addEventListener('resize', resize);
</script>
</body>
</html>
